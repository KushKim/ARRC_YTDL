name: Build YouTube Downloader

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean --windowed --name YouTubeDownloader --collect-all yt_dlp --collect-all certifi main.py

      - name: Package Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path dist/YouTubeDownloader/* -DestinationPath release/YouTubeDownloader-Windows-x64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeDownloader-Windows-x64
          path: release/YouTubeDownloader-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install FFmpeg
        run: |
          brew update
          brew install ffmpeg

      - name: Build macOS app
        run: |
          pyinstaller --noconfirm --clean --windowed --name YouTubeDownloader --osx-bundle-identifier com.personaltools.youtubedownloader --collect-all yt_dlp --collect-all certifi main.py

      - name: Package macOS app
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent YouTubeDownloader.app YouTubeDownloader-macOS.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeDownloader-macOS
          path: dist/YouTubeDownloader-macOS.zip
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: YouTubeDownloader-*
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
